#! The FQDN for accessing the Harbor admin UI and Registry service.
hostname: depot.kube-system.svc
#! The network port of the Envoy service in Contour or another Ingress Controller.
port:
  https: 443

#! Do not change tlsSecretLabels. This is required for VKS integration to work.
tlsCertificate:
  tlsSecretLabels: {"managed-by": "vmware-vRegistry"}


enableNginxLoadBalancer: true
enableContourHttpProxy: false

# This should always be set to true for the Supervisor service.
createNetworkPolicy: true

#! [Required] The initial password for the Harbor admin.
harborAdminPassword: Harbor12345

#! [Required] The secret key used for encryption. Must be a string of 16 characters.
secretKey: 0123456789ABCDEF

database:
  #! If an external database is used, set "type" to "external" 
  #! and fill in the connection information in the "external" section.
  type: internal
  #! [Required] The initial password for the internal Postgres database.
  #! If an external database is used, please fill in external.password.
  password: change-it

core:
  replicas: 1
  #! [Required] This secret is used when the core server communicates with other components.
  secret: change-it
  #! [Required] The XSRF key. Must be a string of 32 characters.
  xsrfKey: 0123456789ABCDEF0123456789ABCDEF
jobservice:
  replicas: 1
  #! [Required] This secret is used when the job service communicates with other components.
  secret: change-it
registry:
  replicas: 1
  #! [Required] This secret is used to secure the upload state from the client
  #! and the registry storage backend.
  #! See: https://github.com/docker/distribution/blob/master/docs/configuration.md#http
  secret: change-it

#! Persistence is always enabled, and a default StorageClass
#! is needed in the K8s cluster to provision volumes dynamically.
#! Specify another StorageClass in "storageClass" or set "existingClaim"
#! if you already have existing persistent volumes to use.
#!
#! For storing images and charts, you can also use "azure", "gcs", "s3",
#! "swift", or "oss". Set this in the "imageChartStorage" section.
persistence:
  persistentVolumeClaim:
    registry:
      #! Use an existing PVC (which must be created manually before binding)
      #! and specify the "subPath" if the PVC is shared with other components.
      existingClaim: ""
      #! Specify the "storageClass" used to provision the volume. Otherwise, the
      #! default StorageClass will be used.
      #! Set it to "-" to disable dynamic provisioning.
      storageClass: "vsan-default-storage-policy"
      subPath: ""
      accessMode: ReadWriteOnce
      size: 10Gi
    jobservice:
      jobLog:
        existingClaim: ""
        storageClass: "vsan-default-storage-policy"
        subPath: ""
        accessMode: ReadWriteOnce
        size: 1Gi
    database:
      existingClaim: ""
      storageClass: "vsan-default-storage-policy"
      subPath: ""
      accessMode: ReadWriteOnce
      size: 1Gi
    redis:
      existingClaim: ""
      storageClass: "vsan-default-storage-policy"
      subPath: ""
      accessMode: ReadWriteOnce
      size: 1Gi
    trivy:
      existingClaim: ""
      storageClass: "vsan-default-storage-policy"
      subPath: ""
      accessMode: ReadWriteOnce
      size: 5Gi
  
#! Metrics used by the core, registry, and exporter.
metrics:
  enabled: true
  core:
    path: /metrics
    port: 8001
  registry:
    path: /metrics
    port: 8001
  exporter:
    path: /metrics
    port: 8001

#! The default [] is equivalent to using both ["IPv4","IPv6"]. Alternatively, you can choose one.
network:
  ipFamilies: ["IPv4"]

#! Cache layer configurations.
#! If this feature is enabled, Harbor will cache the following resources in Redis:
#! `project/project_metadata/repository/artifact/manifest`.
#! This helps improve performance for high-concurrent manifest pulling.
cache:
  #! Disabled by default.
  enabled: false
  #! The cache is kept for one day by default.
  expireHours: 24
