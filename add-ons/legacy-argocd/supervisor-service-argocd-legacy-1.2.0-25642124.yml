apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  creationTimestamp: null
  name: argocd-service.vsphere.vmware.com.1.2.0-25642124
  annotations:
    supportbundler.vmware.com/manifest: argocd-support-bundle-cm
    appplatform.vmware.com/compatibility-check_service: argocd-service-compatibility-api
    appplatform.vmware.com/compatibility-check_port: "8082"
    appplatform.vmware.com/compatibility-check_url: compatibility-check
    appplatform.vmware.com/compatibility-check_protocol: HTTPS
    appplatform.vmware.com/compatibility-check_method: POST
    appplatform.vmware.com/compatibility-check_ca_secret: compatibility-api-cert
    appplatform.vmware.com/compatibility-check_data: |
      {
        "argoCDServiceVersions": [
          "1.1.0",
          "1.2.0"
        ],
        "argoCDVersions": [
          "3.0.*",
          "3.1.*",
          "3.2.*",
          "3.3.*",
          "3.4.*"
        ]
      }
spec:
  refName: argocd-service.vsphere.vmware.com
  releasedAt: "2026-08-01T10:00:00Z"
  template:
    spec:
      deploy:
      - kapp: {}
      fetch:
      - imgpkgBundle:
          image: projects.packages.broadcom.com/vsphere/supervisor/argocd-service/1.2.0/argocd-service:v1.2.0_vmware.1
      template:
      - ytt:
          paths:
          - config/sources
          - config/overlays
      - kbld:
          paths:
          - '-'
          - .imgpkg/images.yml
  valuesSchema:
    openAPIv3:
      type: object
      additionalProperties: false
      properties:
        namespace:
          type: string
          description: argocd-service's namespace
          default: argocd-service
        bundleUrl:
          type: string
          description: package bundle URL for the argocd carvel package
          default: ""
        capabilities:
          type: array
          description: Array of capabilities passed by supervisor service framework
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                default: ""
              value:
                type: boolean
                default: false
          default: []
        keepCRDs:
          type: boolean
          description: Keep CRDs on uninstall
          default: false
        vcfaIntegrated:
          type: boolean
          description: Whether to run inside the VCFA-integrated environment
          default: false
        vcfaInsecureSkipVerify:
          type: boolean
          description: Skip TLS certificate verification when communicating with VCFA
          default: false
        vcfaTimeout:
          type: integer
          description: Timeout in seconds for VCFA API calls (0 means no timeout)
          default: 30
        vcfaReconcilePeriod:
          type: integer
          description: Period in seconds to reconcile ArgoCD CRs to detect VCFA changes (setting it to 0 to disable periodic reconciliation)
          default: 300
        logLevel:
          type: string
          description: Level to configure the verbosity of logging. Can be one of 'debug', 'info', 'error' or any integer value > 0 which corresponds to custom debug levels of increasing verbosity
          default: info
        managerResources:
          type: object
          additionalProperties: false
          description: manager container resource request and limits setting
          properties:
            limits:
              type: object
              additionalProperties: false
              properties:
                cpu:
                  type: string
                  description: cpu limit for manager
                  default: "1"
                memory:
                  type: string
                  description: memory limit for manager
                  default: 1024Mi
                ephemeral-storage:
                  type: string
                  description: ephemeral-storage limit for manager
                  default: ""
            requests:
              type: object
              additionalProperties: false
              description: resource requests for manager
              properties:
                cpu:
                  type: string
                  description: cpu request for manager
                  default: 10m
                memory:
                  type: string
                  description: memory request for manager
                  default: 64Mi
                ephemeral-storage:
                  type: string
                  description: ephemeral-storage request for manager
                  default: ""
        compatibilityApiResources:
          type: object
          additionalProperties: false
          description: compatibility-api container resource request and limits setting
          properties:
            limits:
              type: object
              additionalProperties: false
              properties:
                cpu:
                  type: string
                  description: cpu limit for compatibility-api
                  default: 100m
                memory:
                  type: string
                  description: memory limit for compatibility-api
                  default: 128Mi
                ephemeral-storage:
                  type: string
                  description: ephemeral-storage limit for compatibility-api
                  default: ""
            requests:
              type: object
              additionalProperties: false
              description: resource requests for compatibility-api
              properties:
                cpu:
                  type: string
                  description: cpu request for compatibility-api
                  default: 5m
                memory:
                  type: string
                  description: memory request for compatibility-api
                  default: 32Mi
                ephemeral-storage:
                  type: string
                  description: ephemeral-storage request for compatibility-api
                  default: ""
  version: 1.2.0-25642124
