apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-app
  namespace: argocd-instance
spec:
  project: default
  source:
    repoURL: https://github.com/broadcomryan/vks-testing.git
    path: argocd-app-of-apps
    targetRevision: main
    directory:
      recurse: true
  destination:
    name: https://10.150.4.14:6443
    namespace: argocd-instance
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
